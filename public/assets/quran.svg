<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-label="An open Mushaf resting on a rehal">
  <defs>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DFC9"/><stop offset="1" stop-color="#FDF8F2"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDF8F2"/><stop offset="1" stop-color="#F3DFC9"/>
    </linearGradient>
  </defs>

  <!-- an eight-point star above the book, echoing the page pattern -->
  <g fill="none" stroke="#DC9A63" stroke-width="1.1" opacity=".45">
    <path d="M210 16l8.5 10.5L232 24.5l-1.5 13.5L241 46.5l-10.5 8.5L232 68.5l-13.5-1.5L210 77.5l-8.5-10.5L188 68.5l1.5-13.5L179 46.5l10.5-8.5L188 24.5l13.5 2z"/>
    <circle cx="210" cy="46.5" r="6"/>
  </g>

  <!-- rehal, drawn first so the pages sit in front of it -->
  <g fill="none" stroke="#C8854E" stroke-width="1.7" stroke-linecap="round">
    <path d="M152 236 268 318M268 236 152 318"/>
    <path d="M141 320h58M221 320h58"/>
    <path d="M176 279h68"/>
  </g>

  <!-- pages -->
  <g stroke="#C8854E" stroke-width="1.4" stroke-linejoin="round">
    <path fill="url(#pageL)" d="M210 112C180 95 132 86 74 88v124c58-2 106 7 136 24z"/>
    <path fill="url(#pageR)" d="M210 112c30-17 78-26 136-24v124c-58-2-106 7-136 24z"/>
    <!-- leaf edges, hinting at the thickness of the Mushaf -->
    <g fill="none" stroke-width=".8" opacity=".5">
      <path d="M82 88.3v123.4M90 88.8v122.4M338 88.3v123.4M330 88.8v122.4"/>
    </g>
    <path fill="none" d="M210 112v124"/>
  </g>

  <!-- illuminated frames around each text block -->
  <g fill="none" stroke="#DC9A63">
    <path stroke-width="1" d="M92 126h104v84H92z"/>
    <path stroke-width=".7" opacity=".55" d="M97 131h94v74H97z"/>
    <path stroke-width="1" d="M224 126h104v84H224z"/>
    <path stroke-width=".7" opacity=".55" d="M229 131h94v74h-94z"/>
  </g>

  <!-- lines of script, suggested rather than drawn -->
  <g stroke="#8C8077" stroke-width="2.4" stroke-linecap="round" opacity=".34">
    <path d="M105 143h78M105 157h68M105 171h78M105 185h56"/>
    <path d="M237 143h78M237 157h74M237 171h78M237 185h62"/>
  </g>
</svg>
